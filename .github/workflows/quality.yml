name: Quality Gate

on:
  push:
    branches:
      - ui/qa-integration
  pull_request:
    branches:
      - staging

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://si_cuti_ci:si_cuti_ci@127.0.0.1:5432/si_cuti_ci
  PRIVATE_STORAGE_PATH: /tmp/si-cuti-ci-private
  LOG_LEVEL: silent
  SESSION_TTL_SECONDS: 28800

jobs:
  format:
    name: formatting advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting for changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD --               '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'               '*.json' '*.css' '*.md' '*.yml' '*.yaml'
          )
          if (( ${#files[@]} == 0 )); then
            echo "No changed files require Prettier checking."
            exit 0
          fi
          printf 'Checking formatting for %s changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          npx prettier --check -- "${files[@]}"

  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare private storage path
        run: mkdir -p "$PRIVATE_STORAGE_PATH"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and HTTP tests
        run: npm test
