name: Quality Gate

on:
  push:
    branches:
      - ui/qa-integration
  pull_request:
    branches:
      - staging

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://si_cuti_ci:si_cuti_ci@127.0.0.1:5432/si_cuti_ci
  PRIVATE_STORAGE_PATH: /tmp/si-cuti-ci-private
  LOG_LEVEL: silent
  SESSION_TTL_SECONDS: 28800

jobs:
  format:
    name: formatting advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting for changed files
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD --               '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'               '*.json' '*.css' '*.md' '*.yml' '*.yaml'
          )
          if (( ${#files[@]} == 0 )); then
            echo "No changed files require Prettier checking."
            exit 0
          fi
          printf 'Checking formatting for %s changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          npx prettier --check -- "${files[@]}"

  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare private storage path
        run: mkdir -p "$PRIVATE_STORAGE_PATH"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and HTTP tests
        run: npm test

  integration:
    name: disposable PostgreSQL integration and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_only
          POSTGRES_DB: si_cuti_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d si_cuti_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SI_CUTI_DISPOSABLE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create disposable non-superuser database owner
        env:
          PGPASSWORD: ci_admin_only
        run: |
          psql -h 127.0.0.1 -U postgres -d si_cuti_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE si_cuti_ci LOGIN PASSWORD 'si_cuti_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT CONNECT, CREATE ON DATABASE si_cuti_ci TO si_cuti_ci;
          GRANT USAGE, CREATE ON SCHEMA public TO si_cuti_ci;
          SQL
      - name: Apply migrations to disposable database
        run: npm run db:migrate
      - run: npm run db:generate
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
