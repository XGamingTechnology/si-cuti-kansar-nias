name: si-cuti-edge
services:
  edge:
    image: nginx:1.28.0-alpine3.21
    ports: ["80:80", "443:443"]
    environment:
      PRODUCTION_HOSTNAME: ${PRODUCTION_HOSTNAME:?required}
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?required}
      NGINX_ENVSUBST_FILTER: ^(PRODUCTION_HOSTNAME|STAGING_HOSTNAME)$$
    volumes:
      - ./docker/edge/templates:/etc/nginx/templates:ro
      - ./docker/edge/proxy_params:/etc/nginx/proxy_params:ro
      - ${TLS_CERTIFICATE_PATH:?required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?required}:/etc/nginx/tls/privkey.pem:ro
    networks: [production, staging]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /etc/nginx/conf.d]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  production:
    external: true
    name: ${PRODUCTION_FRONTEND_NETWORK:?required}
  staging:
    external: true
    name: ${STAGING_FRONTEND_NETWORK:?required}
