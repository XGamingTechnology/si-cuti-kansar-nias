name: si-cuti
services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?required}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?required}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: { context: ., target: migrator }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?required}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    restart: "no"
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      PRIVATE_STORAGE_PATH: /var/lib/si-cuti/documents
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - private_documents:/var/lib/si-cuti/documents
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [frontend, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  nginx:
    image: nginx:1.28.0-alpine3.21
    ports: ["${HTTP_PORT:-8080}:8080"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [frontend]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  frontend: {}
  database: { internal: true }
volumes:
  postgres_data: {}
  private_documents: {}
