name: si-cuti-edge
services:
  edge:
    image: nginx:1.28.0-alpine3.21
    ports: ["80:80", "443:443"]
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?required}
      NGINX_ENVSUBST_FILTER: ^STAGING_HOSTNAME$$
    volumes:
      - ./docker/edge/staging-templates:/etc/nginx/templates:ro
      - ./docker/edge/proxy_params:/etc/nginx/proxy_params:ro
      - ${TLS_CERTIFICATE_PATH:?required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?required}:/etc/nginx/tls/privkey.pem:ro
    networks: [staging]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /etc/nginx/conf.d]
    cap_drop: [ALL]
    # Minimal capabilities required by the official Nginx entrypoint/master:
    # chown tmpfs cache paths, bind 80/443, and drop worker uid/gid.
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  staging:
    external: true
    name: ${STAGING_FRONTEND_NETWORK:?required}
